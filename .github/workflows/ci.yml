name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install reproducible test dependencies
        run: python -m pip install -r requirements-reproduce.txt pytest playwright
      - name: verify measured evidence and execute habitat behavior trials
        run: |
          python showcase/verify.py
          node showcase/habitat_benchmark.mjs
      - name: generated websites agree with the authored shell
        run: |
          python tools/build_showcase.py
          git diff --exit-code -- index.html hub_published.html
      - name: launcher, numerical parity and evidence integrity
        run: python -m pytest -q tests
      - name: all five websites work in a real browser
        run: |
          python -m playwright install --with-deps chromium
          python tools/showcase_pages.py
