name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  worm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the library at the worm's commit
        run: python -m pip install "cadence-net @ git+https://github.com/muellerberndt/cadence.git@3d655c84b131388c4ef05d945947fd3e9e786d45" scipy
      - name: The browser brain and body against the committed exports
        run: |
          node worm/tests/parity.mjs
          node worm/tests/body.mjs
      - name: Rebuild the connectome, the newborn brain and the test cases on this machine
        run: |
          python worm/tools/build_connectome.py
          python worm/tools/export_web.py
      - name: The rebuilt exports are the committed ones, exactly where nothing is rounded and to 1e-6 where the library's arithmetic is
        run: python worm/tools/check_exports.py
      - name: The browser brain and body against this machine's library
        run: |
          node worm/tests/parity.mjs
          node worm/tests/body.mjs --cases
  connect_four:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the library at the commit Connect Four's receipts ran against
        run: |
          python -m pip install "cadence-net @ git+https://github.com/muellerberndt/cadence.git@21a120311e9817e817499318f8125896cd19534d" pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test the agent and Connect Four
        run: python -m pytest -q -m "not slow" agent/tests connect_four/tests
      - name: Browser engine parity with the Python agent
        run: |
          python connect_four/tools/parity_fixture.py --train 40 --games 32 --out runs/connect_four/parity
          node connect_four/web/parity.mjs runs/connect_four/parity
  amen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The receipt, the model files and the browser engine against the archived run
        run: python amen/verify.py
  patchworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the library at the commit the twin is checked against
        run: python -m pip install "cadence-net @ git+https://github.com/muellerberndt/cadence.git@02fec624648d421e02ecb00f52f3d3072e9fe9ae"
      - name: The browser brain against the library's RecordPatchNet, on a fresh fixture and on the committed one
        run: |
          python patchworld/ref/make_fixture.py --out /tmp/patchworld_fixture.json
          node patchworld/sim/parity.js /tmp/patchworld_fixture.json
          node patchworld/sim/parity.js
      - name: Mass, the scallop theorem, deterministic replay
        run: node patchworld/tests/physics.test.js
      - name: The built page is the template with the sources inlined
        run: python patchworld/web/build.py --check
