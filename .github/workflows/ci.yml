name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install reproducible test dependencies
        run: python -m pip install -r requirements-reproduce.txt pytest playwright
      - name: verify measured evidence and execute habitat behavior trials
        run: |
          python tools/verify.py
          node tools/habitat_benchmark.mjs
          node tools/nervous_system_benchmark.mjs
          node tools/coupled_brain_benchmark.mjs
          node tools/adaptation_benchmark.mjs
          node connect-four/benchmark.mjs
          node benchmarks/memory/history_benchmark.mjs
          node benchmarks/memory/consolidation_benchmark.mjs
          git diff --exit-code -- eye-arm/evidence.json worm/evidence.json fly/evidence.json connect-four/evidence.json benchmarks/memory/history_evidence.json benchmarks/memory/consolidation_evidence.json evidence/coupled_evidence.json evidence/adaptation_evidence.json
      - name: generated websites agree with the authored shell
        run: |
          python tools/build_showcase.py
          git diff --exit-code -- index.html hub_published.html eye-arm/index.html worm/index.html fly/index.html connect-four/index.html
      - name: launcher, numerical parity and evidence integrity
        run: python -m pytest -q tests
      - name: all four browser demos work in a real browser
        run: |
          python -m playwright install --with-deps chromium
          python tools/showcase_pages.py
          python tools/build_pages.py --output _site

      - name: retain website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: runs/browser/
          if-no-files-found: ignore
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install CPU torch and the composer requirements
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r composer/requirements.txt pytest
      - name: composer tests
        run: PYTHONPATH=composer python -m pytest -q composer/tests
