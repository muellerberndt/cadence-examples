name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "git+https://github.com/muellerberndt/cadence" scikit-learn pandas
      - name: every receipt verifies against the code in this checkout
        run: |
          for d in 01_digits 02_images 03_connect_four 04_pong 05_text 06_sign 07_music 08_cartpole 09_celegans; do
            if [ -f $d/receipt.json ]; then (cd $d && python train.py --verify receipt.json); else echo "$d: no receipt yet"; fi
          done
      - name: the game pages build from the committed nets
        run: |
          for d in 03_connect_four 04_pong 06_sign 07_music; do
            if [ -f $d/net.json ]; then (cd $d && python build_page.py); fi
          done
          git diff --stat --exit-code -- '*/index.html'
      - name: the ladder in the README and the hub is what the receipts say
        run: python tools/ladder.py && git diff --stat --exit-code README.md index.html hub_published.html
      - name: a short learning run works end to end
        run: (cd 01_digits && python train.py --seeds 1 --output /tmp/digits.json && python train.py --verify /tmp/digits.json)
