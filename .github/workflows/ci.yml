name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned Cadence revision and evaluation dependencies
        run: |
          python -m pip install -r requirements-reproduce.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: receipts retain verifiable current or historical source provenance
        run: python tools/verify_receipts.py
      - name: the pages build from the committed nets
        run: |
          for d in 01_digits 03_connect_four 04_pong; do
            if [ -f $d/net.json ]; then (cd $d && python build_page.py); fi
          done
          git diff --stat --exit-code -- '*/index.html'
      - name: the ladder in the README and the hub is what the receipts say
        run: python tools/ladder.py && git diff --stat --exit-code README.md 03_connect_four/README.md 04_pong/README.md 05_memory/README.md 06_interventions/README.md index.html hub_published.html
      - name: reflection isolation and benchmark evidence tests against current Cadence
        run: python -m pip install pytest && python -m pytest -q tests
      - name: every rung runs end to end at a tiny budget and its receipt verifies
        run: python tools/smoke.py
      - name: shipped players meet fresh performance thresholds
        run: python tools/performance.py
      - name: every page works in a real browser and chooses what the engine chooses
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/pages.py --rally 6
