name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  viewer-quickstart:
    runs-on: ubuntu-latest
    env:
      # Exact Cadence 0.18.0 release source.
      CADENCE_REF: "318a48c510eddfafa0cd299451446bf644aa9287"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the release source and test runner
        run: python -m pip install "cadence-net @ git+https://github.com/muellerberndt/cadence@${CADENCE_REF}" pytest
      - name: Viewer resources, documentation and quickstart HTTP integration
        run: python -m pytest -q viewer quickstart
  worm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the library release the examples are verified against
        run: python -m pip install "cadence-net==0.12.0" scipy
      - name: The browser brain and body against the committed exports
        run: |
          node worm/tests/parity.mjs
          node worm/tests/body.mjs
      - name: Rebuild the connectome, the newborn brain and the test cases on this machine
        run: |
          python worm/tools/build_connectome.py
          python worm/tools/export_web.py
      - name: The rebuilt exports are the committed ones, exactly where nothing is rounded and to 1e-6 where the library's arithmetic is
        run: python worm/tools/check_exports.py
      - name: The browser brain and body against this machine's library
        run: |
          node worm/tests/parity.mjs
          node worm/tests/body.mjs --cases
  connect4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the library release the examples are verified against
        run: python -m pip install "cadence-net==0.12.0"
      - name: The receipt, the games in it and the brain the page plays
        run: python connect4/verify.py
      - name: The page reads what the library reads and searches as the reference searches
        run: |
          python connect4/web/export.py --patch connect4/brain/v2.npz --positions 300 --out /tmp/connect4
          node connect4/web/parity.mjs /tmp/connect4
          python connect4/web/search_fixture.py --patch connect4/brain/v2.npz --positions 60 --out /tmp/connect4
          node connect4/web/search_parity.mjs /tmp/connect4
  amen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: The receipt, the model files and the browser engine against the archived run
        run: python amen/verify.py
  patchworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the library release the examples are verified against
        run: python -m pip install "cadence-net==0.12.0"
      - name: The browser brain against the library's RecordPatchNet, on a fresh fixture and on the committed one
        run: |
          python patchworld/ref/make_fixture.py --out /tmp/patchworld_fixture.json
          node patchworld/sim/parity.js /tmp/patchworld_fixture.json
          node patchworld/sim/parity.js
      - name: Mass, the scallop theorem, deterministic replay
        run: node patchworld/tests/physics.test.js
      - name: The built page is the template with the sources inlined
        run: python patchworld/web/build.py --check
  dozing-cat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the library at the commit the receipts name (the belief patch's boundary state landed after the 0.13.0 release)
        run: python -m pip install "cadence-net @ git+https://github.com/muellerberndt/cadence@f06eab065803a61e92fc2f578f24e91eaee48e79"
      - name: The browser brain against the committed recording of the library's decisions, and the sill under chaos
        run: |
          node dozing-cat/tests/parity.mjs
          node dozing-cat/tests/chaos.mjs
      - name: The receipts, the numbers the README states, and the export the page runs
        run: python dozing-cat/verify.py
      - name: Rebuild the export and the recording on this machine, and hold the browser brain to them
        run: |
          python dozing-cat/export.py --out /tmp/dozing-cat --no-viewer
          python dozing-cat/export.py --check
          python dozing-cat/tests/record_parity.py --data /tmp/dozing-cat/brain.json --out /tmp/dozing-cat/parity_cases.json
          node dozing-cat/tests/parity.mjs --data /tmp/dozing-cat/brain.json --cases /tmp/dozing-cat/parity_cases.json
  fruitfly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install "cadence-net==0.17.0" pytest
      - name: All browser controller, retina, settlement and learning regressions
        working-directory: fly-matrix
        run: |
          for test in tests/*.mjs; do node "$test" || exit 1; done
          node tests/assisted-evidence.mjs --1024
          node tests/settlement.mjs --payload
          node tests/assisted-worker.mjs --payload
      - name: Export custody, sensory authority and browser source binding
        working-directory: fly-matrix
        run: python -m pytest -q tests/test_export_web.py tests/test_full_export_integrity.py tests/test_settled_controller.py tests/test_browser_source_binding.py
      - name: Worm learning counters reflect only retained parameter updates
        run: |
          python -m pytest -q worm/tests/test_learning_accounting.py
          node worm/tests/learning-accounting.mjs
  fruitfly-historical-exact:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "25.8.1"
      - name: Frozen checkpoint bitwise replay on the producer runtime family
        working-directory: fly-matrix
        run: |
          node tests/assisted-evidence.mjs --exact
          node tests/assisted-evidence.mjs --1024 --exact
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the library the engine is held to
        run: python -m pip install "cadence-net==0.17.0"
      - name: A fresh brain, its settle cases and a recorded run of the library's actor-critic, replayed through the engine
        run: |
          python engine/make_fixture.py --out /tmp/engine_fixture
          node engine/parity.mjs /tmp/engine_fixture/brain.json /tmp/engine_fixture/cases.json /tmp/engine_fixture/lessons.json
      - name: The examples' copies of the engine are exact
        run: node engine/check_copies.mjs
