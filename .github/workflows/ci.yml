name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install reproducible test dependencies
        run: python -m pip install -r requirements-reproduce.txt pytest playwright
      - name: verify measured evidence and execute habitat behavior trials
        run: |
          python showcase/verify.py
          node showcase/habitat_benchmark.mjs
          node tools/nervous_system_benchmark.mjs
          node tools/coupled_brain_benchmark.mjs
          node connect-four/benchmark.mjs
          node memory/history_benchmark.mjs
          git diff --exit-code -- eye-arm/evidence.json mouse/evidence.json worm/evidence.json fly/evidence.json connect-four/evidence.json memory/history_evidence.json showcase/coupled_evidence.json
      - name: generated websites agree with the authored shell
        run: |
          python tools/build_showcase.py
          git diff --exit-code -- index.html hub_published.html eye-arm/index.html mouse/index.html worm/index.html fly/index.html memory/index.html connect-four/index.html
      - name: launcher, numerical parity and evidence integrity
        run: python -m pytest -q tests
      - name: all six websites work in a real browser
        run: |
          python -m playwright install --with-deps chromium
          python tools/showcase_pages.py
