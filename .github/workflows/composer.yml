name: composer
on:
  push:
    branches: [main]
    paths: ['composer/**', '.github/workflows/composer.yml']
  pull_request:
    paths: ['composer/**', '.github/workflows/composer.yml']
jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install CPU torch and the composer requirements
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r composer/requirements.txt pytest
      - name: composer tests
        run: PYTHONPATH=composer python -m pytest -q composer/tests
