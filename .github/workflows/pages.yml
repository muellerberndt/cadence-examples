name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_gallery.py
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/arm _site/world
          cp index.html .nojekyll _site/
          cp arm/index.html arm/receipt.json _site/arm/
          cp world/index.html world/receipt.json _site/world/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
