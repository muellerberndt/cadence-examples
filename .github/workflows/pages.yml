name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_gallery.py
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/arm _site/world _site/connect_four
          cp index.html .nojekyll _site/
          cp arm/index.html arm/receipt.json _site/arm/
          cp world/index.html world/receipt.json _site/world/
          cp connect_four/index.html connect_four/receipt.json connect_four/cortices.json _site/connect_four/
      - name: Fetch each page's checkpoint snapshots from the release its manifest names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for stage in arm world connect_four; do
            if [ -f $stage/checkpoints.json ]; then
              release=$(python -c "import json; print(json.load(open('$stage/checkpoints.json'))['release'])")
              mkdir -p _site/$stage/checkpoints
              cp $stage/checkpoints.json _site/$stage/
              gh release download "$release" --pattern "$stage-*.json" --dir _site/$stage/checkpoints
              for f in _site/$stage/checkpoints/$stage-*.json; do mv "$f" "_site/$stage/checkpoints/$(basename "$f" | sed "s/^$stage-//")"; done
              python tools/checkpoint_assets.py verify $stage _site/$stage/checkpoints
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
